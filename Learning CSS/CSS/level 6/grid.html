<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>grid</title>
    <style>
        #heading{
            text-align: center;
            text-transform: capitalize;
            font-weight: 800;
        }
        #container{
            width: 600px;
            height: 400px;
            border: 5px solid;
            background-color: aquamarine;
            margin: 5px;
            padding: 10px;

            display: grid;
            grid-template-columns: 110px 110px;
            grid-template-rows: 110px 110px;
        }
        #box1,#box2,#box3,#box4{
            width: 100px;
            height: 100px;
            border: 4px solid;
            margin: 5px;
        }
        #box1{
            background-color: blueviolet;
            grid-column: 1/2;
            grid-row: 1/2;
        }
        #box2{
            background-color: crimson;
            grid-column: 2/2;
            grid-row: 2/2;
        }
        #box3{
            background-color: cadetblue;
            grid-column: 2/2;
            grid-row: 1/2;
        }
        #box4{
            background-color: darkolivegreen;
            grid-column: 1/2;
            grid-row: 2/2;
        }


    </style>
</head>
<body>
    <h1 id="heading">grid container</h1>
    <div id="container">
        <div id="box1">item1</div>
        <div id="box2">item2</div>
        <div id="box3">item3</div>
        <div id="box4">item4</div>
    </div>
</body>
</html>
