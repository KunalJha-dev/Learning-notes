<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flex box(shrink,grow,order)</title>
    <style>
        .heading{
            text-transform: capitalize;
            text-align: center;
        }
        .container{
            width: 800px;
            height: 200px;
            border: 5px solid;
            margin: 5px;
            padding: 10px;
            background-color: rgb(148, 83, 208);
            display: flex;
        }
        .box{
            width: 250px;
            height: 150px;
            border: 4px solid;
            margin: 5px;
            padding: 4px;
        }
        #box1{
            background-color: brown;
            order: 4;
        }
        #box2{
            background-color: aquamarine;
            flex-grow:1 ;
            order: 1;
        }
        #box3{
            background-color: burlywood;
            flex-shrink:2 ;
            order: 2;
        }
        #box4{
            background-color: cornflowerblue;
            order: 3;
        }
    </style>
</head>
<body>
    <h1 class="heading">container1</h1>
   <div id="container1" class="container">
    <div id="box1" class="box">flex_item1</div>
    <div id="box2" class="box">flex_item2</div>
    <div id="box3" class="box">flex_item3</div>
    <div id="box4" class="box">flex_item4</div>
   </div> 
</body>
</html>
