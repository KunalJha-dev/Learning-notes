<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>box_model</title>
    <style>
        *{
            width: 70px;
            height: 50px;
            padding: 5px;
            margin:5px
        }
        #button1{
            background-color:rgb(96, 233, 65) ;
            border-style: solid;
            border-width: 5px;
            border-color: coral;
            border-radius: 10px;
            box-sizing: content-box;
            
        }
        #button2{
            background-color: darkgreen;
            border-style: solid;
            border-width:5px;
            border-color: aqua;
            border-radius:10px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <button id="button1">button1</button>
    <button id="button2">button2</button>
</body>
</html>
