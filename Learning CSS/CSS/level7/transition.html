<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transition</title>
    <style>
        .transition{
            width: 150px;
            height: 40px;
            font-weight: 800;
            font-size: 20px;
            border: 2px solid blue;
            border-radius: 20px;
            background-color:rgb(123, 153, 209);
            transition-property: all;
            transition-duration:100ms;
            transition-timing-function: ease-in-out;
            transition-delay: 0ms;
        }
        .transition:hover{
            width: 160px;
            height: 45px;
            border-color: brown;
        }
        .transition:active{
            background-color: rgb(70, 192, 86);
            border-color: red;
        }
    </style>
</head>
<body>
    <button class="transition">Check</button>
</body>
</html>
