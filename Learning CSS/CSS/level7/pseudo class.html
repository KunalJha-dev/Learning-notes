<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>psuedo class</title>
    <style>
        .psuedo{
            width: 100px;
            height: 50px;
            margin: 20px;
            text-transform: capitalize;
            font-weight: 800;
            font-family:Arial, Helvetica, sans-serif;
            border: 2px solid blue;
            border-radius:10px;
            background-color: rgb(118, 197, 221);
        }
        .psuedo:hover{
            width: 110px;
            height: 60px;
            border-color: red;
        }
        .psuedo:active{
            background-color: blue;
        }
    </style>
</head>
<body>
    <button class="psuedo">learning psuedo</button>
</body>
</html>
