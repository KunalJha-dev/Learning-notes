<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>display property</title>
    <style>
        *{
            width: 50px;
            height: 50px;
            padding: 0;
            margin: 0;
        }
        .box{
            display: block;
            
        }
        #box1{
            margin: 5px;
            background-color: blue;
        }
        #box2{
            margin: 5px;
            background-color: burlywood;
        }
    </style>
</head>
<body>
    <div id="box1" class="box">box</div>
    <div id="box2" class="box">box2</div>
</body>
</html>
