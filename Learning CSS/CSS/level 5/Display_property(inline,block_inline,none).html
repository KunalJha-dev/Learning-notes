<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        
        .box{
            width: 50px;
            height: 50px;
            display: inline;
        }
        #box1{
            background-color: aqua;
            margin: 5px;
        }
        #box2{
            background-color: cornflowerblue;
            margin: 5px;
        }
        .box_block{
            width: 50px;
            height: 50px;
            margin: 10px;
            text-align: center;
            font-weight: 800;
            display: inline-block;
        }
        #box3{
            background-color: blueviolet;
        }
        #box4{
            background-color: cadetblue;
        }

        #visibility_space{
            width: 50px;
            height: 50px;
            background-color: chartreuse;
            display: none;
        }
    </style>
</head>
<body>
    <div id="box1" class="box">box1</div>
    <div id="box2" class="box">box2</div>
    <hr>
    <div id="box3" class="box_block">box3</div>
    <div id="box4" class="box_block">box4</div>
    <hr>
    <div id="visibility_space">box5</div>

</body>
</html>
