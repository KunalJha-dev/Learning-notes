<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>visibility</title>
    <style>
        div{
            width: 200px;
            height: 200px;
        }
        #box1{
            background-color: brown ;
            visibility: hidden;
        }
        #box2{
            background-color: blue;
            visibility: visible;
        }
    </style>
</head>
<body>
    <div id="box1">box1</div> <br>
    <div id="box2">box2</div>
</body>
</html>
