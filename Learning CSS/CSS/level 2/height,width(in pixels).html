<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>height,width(in pixels)</title>
    <style>
        .box{
            width: 200px;
            height: 200px;
        }
        #one{
            color: blue; 
            background-color: aquamarine;
        }
        #two{
            color: brown;
            background-color: rgb(109, 42, 100);
        }
        #three{
            color: rgb(56, 136, 59);
            background-color: chocolate;
        }
    </style>
</head>
<body>
    <div id="one" class="box"><b>box1</b></div> <br>
    <div id="two" class="box"><b>box2</b></div> <br>
    <div id="three" class="box"><b>box3</b></div>
</body>
</html>
