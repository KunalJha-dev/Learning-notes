<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>practice set 4</title>
    <style>
        #content_box{
            width: 200px;
            height: 200px;
            background-color: firebrick;
        }
        #button{
            width: 50px;
            height: 50px;
            background-color: rgb(241, 190, 63);
            text-align: center;
            padding: 10px 15px 10px 15px;
            margin: 100px;
            border-style: dotted;
            border-width: 5px;
            border-radius: 50px;
        }
        #box1{
            width: 70px;
            height: 70px;
            background-color: blanchedalmond;
            text-align: center;
            margin: 5px;
            box-sizing: border-box;
            padding: 5px;
        }
        #box2{
            width: 70px;
            height: 70px;
            background-color: aquamarine;
            text-align: center;
            margin: 10px;
            box-sizing: content-box;
            padding: 5px;
        }
    </style>
</head>
<body>
    <div id="content_box"></div>
    <hr>
    <div id="button">
        <button>button</button>
    </div>
    <hr>
    <div id="box1">box1</div>
    <div id="box2">box2</div>
</body>
</html>
