<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Me</title>
  </head>
  <body>
    <header><h1><i>Contact Me</i></h1></header>
    <main>
      <section>
    <table border="1">
      <tr>
        <td>
          <label for="name">Enter name:</label>
        </td>
        <td>
          <input type="text" name="name" id="name" /> 
        </td>
      </tr>
      <tr>
        <td>
          <label for="date">Enter date you're sending this info:</label>
          </td>
          <td>
          <input type="date" name="date" id="date" /> 
        </td>
      </tr>
      <tr>
        <td>
            <label for="city">Enter your city:</label>

        </td>
        <td>
            <input type="text" name="city" id="city">
        </td>
      </tr>
      <tr>
        <td>
            <label for="number">Enter your number:</label>
        </td>
        <td>
            <input type="number" name="number" id="number">
        </td>
      </tr>
      <tr>
        <td>
           <label for="files">Forward necessary files:</label>
           </td>
           <td>
           <input type="file" name="file" id="file"> 
        </td>
      </tr>
      
    </table>
    </section>

    <section>

      <label for="text"><u><h2>Anything else you think i shoud know about</h2></u></label> <br>
      <textarea name="text" id="text" rows="5" cols="50"></textarea> <br>
      

      <input type="submit" >
      </section>
      </main>

      <hr>

      <footer>
        <a href="https://in.linkedin.com/">linkdin</a>
      </footer>

    
  </body>
</html>
