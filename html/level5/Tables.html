<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>table</title>
</head>
<body>
    <table border="1"> <!--table tag-->
        <!--caption tag-->
        <caption>student marks</caption> 
        <!--table row-->
        <tr>
            <!--colspan tag--> 
            <th colspan="3">report card for some subjects</th>
        </tr>
        <tr>
            <!--table heading-->
            <th>student names</th>
            <th>subject</th>
            <th>marks</th>
        </tr>
        <tr>
            <!--table data-->
            <td>rahul</td>
            <td>science</td>
            <td>50/100</td>
        </tr>
        <tr>
            <td>shulekha</td>
            <td>evs</td>
            <td>60/100</td>
        </tr>
    </table>
</body>
</html>
