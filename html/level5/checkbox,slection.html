<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>checkbox,selection</title>
</head>
<body>
    <!--checkbox-->
    <label for="java">java</label>
    <input type="checkbox" name="lang" id="java" value="java"> <br>
    <label for="c++">c++</label>
    <input type="checkbox" name="lang" id="c++" value="c++"> <br>
    <label for="python">python</label>
    <input type="checkbox" name="lang" id="python" value="python"> <hr>

    <!--selection-->
    <label for="country">choose a country</label>
    <select name="country" id="country">
        <option value="japan">japan</option>
        <option value="newyork">newyork</option>
        <option value="switcherland">switcherland</option>
    </select>

</body>
</html>
